# Pages CMS settings: https://pagescms.org/docs/configuration/
# Sign in at https://app.pagescms.org with GitHub and open this repository.

# Images uploaded in the editor are saved to imgs/blog/.
# The site lives under /cosmopolitan72/, so that prefix is part of the public path.
media:
  input: imgs/blog
  output: /cosmopolitan72/imgs/blog
  rename: safe
  categories: [image]

content:
  - name: posts
    label: 블로그 글
    type: collection
    path: _posts
    format: yaml-frontmatter
    # Jekyll needs YYYY-MM-DD-name.md. The time keeps Korean titles out of the address;
    # you can type an English name (e.g. 2026-11-14-xss-basics.md) when creating a post.
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}{second}.md"
      field: create
    view:
      primary: title
      fields: [title, date, published]
      sort: date
      order: desc
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: date
        label: 날짜
        type: date
        options:
          format: yyyy-MM-dd
      - name: description
        label: 요약
        type: text
        description: 글 목록에 보이는 한두 문장입니다. 비워 두면 본문 앞부분이 대신 나옵니다.
      - name: tags
        label: 태그
        type: string
        list: true
      - name: cover
        label: 대표 이미지
        type: image
        description: 선택 사항입니다. 글 목록과 글 맨 위에 보입니다.
      - name: published
        label: 공개
        type: boolean
        default: true
        description: 끄고 저장하면 사이트에 보이지 않는 임시 저장 글이 됩니다.
      - name: body
        label: 본문
        type: rich-text
        options:
          format: markdown

  # 홈의 Projects 카드. 순서를 바꾸면 홈에 보이는 순서도 바뀝니다.
  - name: projects
    label: 프로젝트
    type: file
    path: _data/projects.yml
    format: yaml
    list: true
    fields:
      - name: title
        label: 이름
        type: string
        required: true
        description: 카드 제목입니다. 예) 개인정보 가명처리 도구
      - name: repo
        label: 저장소 이름
        type: string
        description: 제목 아래 작게 보입니다. 예) pseudonymization_tool
      - name: year
        label: 연도
        type: string
      - name: summary
        label: 소개
        type: text
        description: 무엇을 하는 프로젝트인지 한두 문장으로 적어 주세요.
      - name: points
        label: 주요 기능
        type: string
        list: true
      - name: tags
        label: 기술 태그
        type: string
        list: true
      - name: link
        label: 링크
        type: string
        description: GitHub 저장소나 데모 주소 (https://로 시작)

  # 약력. Timeline 페이지(pages/k.html)에 위에서부터 이 순서대로 보입니다(오래된 것이 위).
  # "홈에 표시"를 켠 항목은 홈 My Workspace에도 최신순으로 최대 5개 보입니다.
  - name: timeline
    label: 약력
    type: file
    path: _data/timeline.yml
    format: yaml
    list: true
    fields:
      - name: date
        label: 날짜
        type: string
        description: 예) 2026.11 또는 2023
      - name: title
        label: 내용
        type: string
        required: true
      - name: type
        label: 종류
        type: select
        options:
          values: [수상, 경력, 자격증, 교육, 대회, 프로젝트, 활동]
      - name: highlight
        label: 홈에 표시
        type: boolean
        default: false
        description: 켜면 홈 My Workspace의 약력 요약에도 보입니다.
