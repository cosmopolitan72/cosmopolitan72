- title: 개인정보 가명처리 도구
  repo: pseudonymization_tool
  year: "2025"
  summary: CSV 파일 속 개인정보를 삭제·통계·일반화 기법으로 가명처리하고, 가명키를 만들어 서로 다른 데이터를 결합하는 도구입니다.
  points:
    - "삭제: 마스킹, 부분 삭제, 행 항목 삭제, 로컬 삭제"
    - "통계: 총계 처리, 부분 총계"
    - "일반화: 라운딩, 상하단 코딩, 로컬 일반화, 범위 방법, 범주화"
    - "가명키 생성 후 여러 CSV 결합"
  tags: [Python, CSV, 개인정보보호]
  link: https://github.com/cosmopolitan72/pseudonymization_tool

- title: 악성코드 검사기
  repo: Malwaredetecter
