<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 150 | escape }}">
  <link rel="icon" href="{{ '/imgs/cos%20bo%201.png' | relative_url }}" type="image/png">
  <link rel="stylesheet" href="{{ '/css/bootstrap.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/fontawesome.min.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/css/blog.css' | relative_url }}">
</head>
<body class="blog-page">
  <nav class="navbar navbar-expand-lg blog-nav" aria-label="사이트 메뉴">
    <div class="container">
      <a class="navbar-brand" href="{{ '/' | relative_url }}"><img src="{{ '/imgs/coss.png' | relative_url }}" alt="cosmopolitan 홈"></a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#blog-menu" aria-controls="blog-menu" aria-expanded="false" aria-label="메뉴 열기">
        <span class="fas fa-caret-down" aria-hidden="true"></span>
      </button>
      <div class="collapse navbar-collapse" id="blog-menu">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item"><a class="nav-link" href="{{ '/' | relative_url }}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ '/index.html#about' | relative_url }}">About</a></li>
          <li class="nav-item active"><a class="nav-link" href="{{ '/blog.html' | relative_url }}">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="https://github.com/cosmopolitan72" target="_blank" rel="noopener" aria-label="GitHub"><i class="fab fa-github" aria-hidden="true"></i></a></li>
          <li class="nav-item"><a class="nav-link" href="https://www.instagram.com/cosm_opolitan72/" target="_blank" rel="noopener" aria-label="Instagram"><i class="fab fa-instagram" aria-hidden="true"></i></a></li>
        </ul>
      </div>
    </div>
  </nav>

  {{ content }}

  <footer class="blog-footer">
    <div class="container blog-footer__inner">
      <a class="blog-footer__brand" href="{{ '/' | relative_url }}"><img src="{{ '/imgs/coss.png' | relative_url }}" alt="cosmopolitan"></a>
      <ul class="blog-footer__links">
        <li><a href="https://sites.google.com/view/cosmopolitan72/home" target="_blank" rel="noopener" aria-label="Google Sites"><i class="fas fa-globe" aria-hidden="true"></i></a></li>
        <li><a href="https://www.instagram.com/cosm_opolitan72/" target="_blank" rel="noopener" aria-label="Instagram"><i class="fab fa-instagram" aria-hidden="true"></i></a></li>
        <li><a href="https://github.com/cosmopolitan72" target="_blank" rel="noopener" aria-label="GitHub"><i class="fab fa-github" aria-hidden="true"></i></a></li>
      </ul>
      <p class="blog-footer__copy">© {{ site.time | date: '%Y' }} cosmopolitan · All rights reserved.</p>
    </div>
  </footer>

  <script src="{{ '/js/jquery-3.3.1.min.js' | relative_url }}"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="{{ '/js/bootstrap.min.js' | relative_url }}"></script>
</body>
</html>
